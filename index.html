<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="main.js"></script>
</head>
<body onload="time_bc()"> 
    <section class="main-container">
        <h1 id="h1">Bac_2k27</h1>
        <h4 id="h4">Starting in...</h4>
        <article class="countdown-container">
            <div class="time-box">
                <h1 id="dday">000</h1>
                <h2 class="time-pre">Days</h2>
            </div>
            <div class="time-box">
                <h1 id="hhour">00</h1>
                <h2 class="time-pre">Hours</h2>
            </div>
            <div class="time-box">
                <h1 id="mminute">00</h1>
                <h2 class="time-pre">Minutes</h2>
            </div>
            <div class="time-box no-border">
                <h1 id="ssecond">00</h1>
                <h2 class="time-pre">Seconds</h2>
            </div>
        </article>
        <p class="description">
            Every second brings us closer to the big launch.<br>
            Enter your email to be the first to know the moment the timer hits zero.
        </p>
        <div class="form-container">
            <input type="email" id="user-email" placeholder="Email" class="email-input" required>
            <button id="notify-btn" class="notify-btn" onclick="rt()">Notify me</button>
        </div>
        <div class="social-icons">
            <a href=""><img src="" alt=""></a>
            <a href=""><img src="" alt=""></a>
            <a href=""><img src="" alt=""></a>
            <a href=""><img src="" alt=""></a>
            <a href=""><img src="" alt=""></a>
        </div>
    </section>
</body>
</html>
